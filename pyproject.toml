[project]
name = "tm1-dump"
description = "Small, fast TM1py-based CLI that dumps one TM1 instance to one zip — and reloads it onto another server."
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
    "tm1py>=2.0.2",
]

[project.scripts]
tm1-dump = "tm1_dump.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.15",
]

[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
fallback_version = "0.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
