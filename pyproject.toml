[project]
name = "tm1-dump"
version = "0.1.0"
description = "Small, fast TM1py-based CLI that dumps one TM1 instance to one zip — and reloads it onto another server."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tm1py>=2.0.2",
]

[project.scripts]
tm1-dump = "tm1_dump.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tm1_dump"]

[tool.pytest.ini_options]
testpaths = ["tests"]
